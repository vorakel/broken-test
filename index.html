<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broken Pixel NFT</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#101116}
body{display:flex;align-items:center;justify-content:center}
.viewer{position:relative;width:min(100vw,100vh);aspect-ratio:1/1;overflow:hidden;background:#baf2d8}
#art{display:block;width:100%;height:100%;object-fit:contain}
.switches{position:absolute;left:8px;bottom:8px;display:flex;gap:5px;z-index:2}
button{appearance:none;border:1px solid rgba(255,255,255,.8);border-radius:5px;padding:5px 8px;background:rgba(17,20,25,.85);color:#fff;font:600 12px/1.1 system-ui,sans-serif;cursor:pointer}
button[aria-pressed="true"]{background:#fff;color:#17191c}
#status{position:absolute;left:8px;right:8px;top:8px;z-index:3;padding:8px;background:rgba(0,0,0,.82);color:white;font:12px system-ui,sans-serif;display:none;overflow-wrap:anywhere}
</style>
</head>
<body>
<main class="viewer">
<img id="art" src="./broken-pixel.jpg" alt="Broken Pixel NFT artwork">
<div class="switches" role="group" aria-label="Choose artwork">
<button id="brokenBtn" type="button" aria-pressed="true">Broken Pixel</button>
<button id="originalBtn" type="button" aria-pressed="false">Original</button>
</div>
<div id="status" role="status"></div>
</main>
<script src="./app.js" defer></script>
</body>
</html>
